version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: wexare
      POSTGRES_PASSWORD: wexare
      POSTGRES_DB: wexare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    command: anvil --host 0.0.0.0 --port 8545
    ports:
      - "8545:8545"
  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg2://wexare:wexare@postgres:5432/wexare
    ports:
      - "8000:8000"
    depends_on:
      - postgres
  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
